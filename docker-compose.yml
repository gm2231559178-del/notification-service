version: "3.9"

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  backend:
    driver: bridge
  business:
    # Isolated network: only outbox-worker and business-postgres sit here.
    # notification-service has NO interface on this network.
    driver: bridge
  observability:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  pg_data:
  business_pg_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

# ── Services ──────────────────────────────────────────────────────────────────
services:
  # ── PostgreSQL (notification-service own DB) ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-notifications}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-notifications}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── PostgreSQL (business service DB) ─────────────────────────────────────
  # Only accessible from the 'business' network.
  # notification-service is NOT on that network — it cannot reach this DB.
  business-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${BUSINESS_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${BUSINESS_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${BUSINESS_POSTGRES_DB:-business}
    ports:
      - "${BUSINESS_POSTGRES_PORT:-5433}:5432"
    volumes:
      - business_pg_data:/var/lib/postgresql/data
    networks:
      - business        # ← only on 'business' network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${BUSINESS_POSTGRES_USER:-postgres} -d ${BUSINESS_POSTGRES_DB:-business}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── RabbitMQ ─────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend
      - business        # both workers share the same broker
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Mailpit — local SMTP catch-all (dev only) ─────────────────────────────
  # Started with: docker compose --profile dev up
  # Web UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - backend
    profiles:
      - dev

  # ── Notification service ──────────────────────────────────────────────────
  # Connects to: its own postgres, rabbitmq.
  # Cannot reach: business-postgres (not on 'business' network).
  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: notification-service:latest
    restart: unless-stopped
    stop_grace_period: 35s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./config/local.toml:/app/config/local.toml:ro
    environment:
      NS__DATABASE__URL: >-
        postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-notifications}
      NS__AMQP__URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      NS__MAILER__PASSWORD: ${SMTP_PASS:-}
      # NS__HTTP__API_KEY: ${API_KEY}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${SERVICE_PORT:-8080}:8080"
      - "${METRICS_PORT:-9091}:9091"
    networks:
      - backend         # ← NOT on 'business' network
      - observability

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Outbox worker ─────────────────────────────────────────────────────────
  # Connects to: business-postgres (read/write outbox table), rabbitmq.
  # Cannot reach: notification-service's postgres (not on 'backend' network).
  outbox-worker:
    build:
      context: .
      dockerfile: Dockerfile.outbox
    image: outbox-worker:latest
    restart: unless-stopped
    stop_grace_period: 35s
    depends_on:
      business-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NS_OUTBOX__DATABASE_URL: >-
        postgres://${BUSINESS_POSTGRES_USER:-postgres}:${BUSINESS_POSTGRES_PASSWORD:-postgres}@business-postgres:5432/${BUSINESS_POSTGRES_DB:-business}
      NS_OUTBOX__AMQP_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      NS_OUTBOX__EXCHANGE: ${AMQP_EXCHANGE:-notifications}
      NS_OUTBOX__ROUTING_KEY: ${AMQP_ROUTING_KEY:-email.requested}
      NS_OUTBOX__POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}
      NS_OUTBOX__BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
      RUST_LOG: ${RUST_LOG:-info}
    networks:
      - business        # ← NOT on 'backend' network

  # ── Prometheus ────────────────────────────────────────────────────────────
  # Started with: docker compose --profile observability up
  prometheus:
    image: prom/prometheus:v2.52.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - observability
    profiles:
      - observability

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.0.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - observability
    profiles:
      - observability
